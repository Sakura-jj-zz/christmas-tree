<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merry Christmas · 2026</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Great+Vibes&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{-webkit-tap-highlight-color:transparent;transition:opacity .42s ease}
  body.out{opacity:0}

  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;will-change:transform}

  #veil{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}

  #go{
    pointer-events:auto;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,228,186,.30);
    border-radius:999px;
    color:#f2e3c4;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    font-weight:300;
    font-size:clamp(.86rem,2.5vmin,1.06rem);
    letter-spacing:.46em;
    padding:clamp(1rem,2.6vmin,1.3rem) clamp(2.6rem,7vmin,3.6rem) clamp(1rem,2.6vmin,1.3rem) calc(clamp(2.6rem,7vmin,3.6rem) + .46em);
    line-height:1;
    position:relative;
    box-shadow:0 0 0 1px rgba(255,236,200,.04) inset, 0 0 24px rgba(255,210,160,.10), 0 0 60px rgba(255,190,150,.05);
    transition:opacity .34s ease, transform .34s ease, border-color .3s ease, color .3s ease, box-shadow .4s ease;
    animation:breathe 3.6s ease-in-out infinite;
  }
  #go::after{
    content:"";position:absolute;inset:-1px;border-radius:999px;pointer-events:none;
    background:radial-gradient(circle at 50% 120%, rgba(255,214,168,.16), rgba(255,214,168,0) 62%);
  }
  #go:hover, #go:focus-visible{
    outline:none;
    border-color:rgba(255,236,204,.72);
    color:#fffaf0;
    box-shadow:0 0 0 1px rgba(255,240,206,.10) inset, 0 0 30px rgba(255,214,160,.30), 0 0 90px rgba(255,180,140,.14);
  }
  #go.off{opacity:0;transform:scale(.94);pointer-events:none}

  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 1px rgba(255,236,200,.04) inset, 0 0 22px rgba(255,210,160,.09), 0 0 56px rgba(255,190,150,.04)}
    50%{box-shadow:0 0 0 1px rgba(255,236,200,.10) inset, 0 0 34px rgba(255,214,166,.22), 0 0 84px rgba(255,186,146,.09)}
  }
  @media (prefers-reduced-motion: reduce){ #go{animation:none} }

  /* ── 第三页：左上角一张小唱片，中间一本可以翻页的相册 ───────────── */
  #discStage{
    position:fixed;inset:0;z-index:9;
    background:
      radial-gradient(ellipse 86% 62% at 50% 40%, #0b0409 0%, #010001 72%),
      #000;
    opacity:0;pointer-events:none;
    transition:opacity 1.5s ease;
    overflow:hidden;
  }
  #discStage.on{opacity:1;pointer-events:auto}
  #discStage.no-anim, #discStage.no-anim *{transition:none !important;animation:none !important}

  /* 左上角的小唱片：光晕 + 黑胶 + 标签层 */
  #discHolder{
    position:absolute;left:7vw;top:9vh;
    width:clamp(92px, 26vmin, 168px);aspect-ratio:1;
    opacity:0;transition:opacity 2.4s ease .15s;
  }
  #discStage.on #discHolder{opacity:1}
  #discHolder .ring{
    position:absolute;left:50%;top:50%;width:320%;aspect-ratio:1;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle, rgba(255,90,160,0) 46%, rgba(255,90,160,.10) 58%, rgba(255,60,140,0) 74%);
  }
  #discGlow{
    position:absolute;left:50%;top:50%;
    width:210%;aspect-ratio:1;
    transform:translate(-50%,-50%) scale(1);
    background:radial-gradient(circle at 50% 50%,
      rgba(255,104,166,.46), rgba(255,42,124,.18) 42%, rgba(255,0,90,0) 69%);
    opacity:.42;
    will-change:transform,opacity;
    pointer-events:none;
  }

  /* 切换图片时的粒子特效层 */
  #fx{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:7;
  }

  #discTitle{
    position:absolute;left:auto;right:6.5vw;top:6.2vh;text-align:right;width:max-content;max-width:90vw;
    font-family:"Great Vibes","Segoe Script",cursive;
    color:#fff0f7;font-size:clamp(15px, 4.7vmin, 38px);line-height:1;
    white-space:nowrap;pointer-events:none;
    text-shadow:0 0 16px rgba(255,64,150,.85), 0 0 46px rgba(255,38,126,.5);
    opacity:0;transition:opacity 2s ease .7s;
  }
  #discStage.on #discTitle{opacity:1}

  #discWrap{
    position:absolute;inset:0;
    opacity:0;transform:scale(.80);
    transition:opacity 3.0s ease, transform 3.6s cubic-bezier(.16,.70,.18,1);
  }
  #discStage.on #discWrap{opacity:1;transform:scale(1)}

  #disc{
    position:absolute;inset:0;border-radius:50%;
    animation:spin 22s linear infinite;
    background:
      repeating-radial-gradient(circle at 50% 50%, #14101a 0 3px, #08060d 3px 6px),
      #08060d;
    box-shadow:
      0 0 26px rgba(255,54,138,.26),
      0 0 74px rgba(255,30,110,.14),
      inset 0 0 40px rgba(255,255,255,.05),
      inset 0 0 0 1px rgba(255,255,255,.07);
  }
  #sheen{
    position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(128deg,
      rgba(255,255,255,.17) 0%, rgba(255,255,255,.04) 21%,
      rgba(255,255,255,0) 39%, rgba(255,255,255,0) 61%,
      rgba(255,255,255,.06) 79%, rgba(255,255,255,.21) 100%);
    mix-blend-mode:screen;pointer-events:none;
  }
  #label{
    position:absolute;left:50%;top:50%;
    width:44%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:2;
    background:radial-gradient(circle at 36% 28%, #ffe8f2 0%, #ff9dc5 28%, #f1538f 62%, #9c2356 100%);
    box-shadow:inset 0 0 14px rgba(120,10,50,.35), 0 0 14px rgba(255,120,180,.25);
    border:1px solid rgba(255,228,242,.42);
  }
  #label .hole{
    position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:#060509;box-shadow:inset 0 0 8px rgba(0,0,0,.85);
  }
  #label .t{
    position:absolute;left:0;right:0;top:13%;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:min(1.75vmin,12px);font-weight:600;line-height:1;
    letter-spacing:.04em;color:#430c26;
    text-shadow:0 1px 0 rgba(255,255,255,.32);
  }
  #label .s{
    position:absolute;left:0;right:0;bottom:12%;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:min(1.42vmin,9.5px);font-weight:500;line-height:1;
    letter-spacing:.06em;color:#4d0f2b;opacity:.9;
  }

  #discMeta{
    position:absolute;left:7vw;top:calc(9vh + clamp(92px, 26vmin, 168px) + 18px);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-weight:300;font-size:clamp(10.5px, 2.2vmin, 12.5px);letter-spacing:.16em;
    color:#ffe3f0;pointer-events:none;
    opacity:0;transition:opacity 2s ease 1.4s;
    text-shadow:0 0 16px rgba(255,96,172,.55), 0 0 40px rgba(255,60,150,.28);
  }
  #discStage.on #discMeta{opacity:1}

  /* 手动播放/暂停：浏览器拦截自动播放时，点这里就出声 */
  #discPlay{
    position:absolute;left:7vw;top:calc(9vh + clamp(92px, 26vmin, 168px) + 46px);
    display:flex;align-items:center;gap:7px;height:32px;padding:0 14px 0 11px;
    border-radius:999px;cursor:pointer;z-index:8;
    border:1px solid rgba(255,158,200,.42);
    background:linear-gradient(180deg, rgba(255,86,152,.26), rgba(120,20,60,.28));
    color:#ffd8e8;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:12px;letter-spacing:.10em;line-height:1;
    box-shadow:0 0 22px rgba(255,60,140,.35), inset 0 0 16px rgba(255,120,175,.16);
    backdrop-filter:blur(8px);
    opacity:0;transform:translateY(4px);pointer-events:none;
    transition:opacity .5s ease, transform .5s ease, background .3s ease;
  }
  #discPlay .ico{font-size:11px;opacity:.9}
  #discPlay.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #discPlay.pulse{animation:playPulse 2.6s ease-in-out infinite}
  @keyframes playPulse{
    0%,100%{box-shadow:0 0 18px rgba(255,60,140,.30), inset 0 0 14px rgba(255,120,175,.14)}
    50%{box-shadow:0 0 34px rgba(255,60,140,.62), inset 0 0 18px rgba(255,140,190,.26)}
  }
  #discPlay:hover{background:linear-gradient(180deg, rgba(255,96,160,.40), rgba(140,24,70,.34))}

  @keyframes spin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* 地面上的礼物盒：点哪一个，就打开属于它的那张图和那段字 */
  #giftRow{
    position:absolute;left:0;right:0;bottom:5.4vh;z-index:4;
    display:flex;align-items:flex-end;justify-content:center;
    gap:min(2.6vw,26px);padding:0 4vw;
    opacity:0;transform:translateY(16px);
    transition:opacity 2s ease .5s, transform 2.4s cubic-bezier(.18,.72,.18,1) .5s;
  }
  #discStage.on #giftRow{opacity:1;transform:translateY(0)}

  .gbox{
    position:relative;flex:0 0 auto;
    width:clamp(50px, var(--w), 132px);
    aspect-ratio:1/0.88;
    border:0;background:none;padding:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    transform:translateY(calc(var(--dy) * -1 - var(--arc, 0px))) scale(var(--sc, 1)) rotate(var(--rot, 0deg));
    transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .5s ease;
    filter:drop-shadow(0 12px 26px rgba(0,0,0,.62));
    animation:giftFloat 5.6s ease-in-out infinite;
    animation-delay:var(--dly);
  }
  @keyframes giftFloat{
    0%,100%{translate:0 0}
    50%{translate:0 -5px}
  }
  .gbox:hover{
    transform:translateY(calc(var(--dy) * -1 - var(--arc, 0px) - 9px)) scale(calc(var(--sc, 1) * 1.05)) rotate(var(--rot, 0deg));
    filter:drop-shadow(0 18px 32px rgba(0,0,0,.7));
  }
  .gbox:active{
    transform:translateY(calc(var(--dy) * -1 - var(--arc, 0px))) scale(calc(var(--sc, 1) * .96)) rotate(var(--rot, 0deg));
  }

  /* 点开过的盒子会一直亮着，像已经拆开的礼物 */
  .gbox.lit{filter:drop-shadow(0 0 20px rgba(255,140,190,.52)) drop-shadow(0 12px 26px rgba(0,0,0,.62))}
  .gbox.lit .glow{
    opacity:1;
    background:radial-gradient(circle, rgba(255,158,196,.62), rgba(255,96,162,.22) 44%, rgba(255,80,150,0) 72%);
    animation:litBreath 3.4s ease-in-out infinite;
  }
  @keyframes litBreath{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.06);opacity:1}}
  .gbox.lit .body{
    box-shadow:
      inset 0 0 0 1px rgba(255,232,242,.34),
      inset 0 -12px 24px rgba(0,0,0,.36),
      inset 0 8px 16px rgba(255,255,255,.22),
      0 0 24px rgba(255,150,196,.28);
  }
  .gbox.lit .lid{box-shadow:inset 0 0 0 1px rgba(255,236,246,.34), inset 0 -8px 16px rgba(0,0,0,.32), 0 8px 20px rgba(0,0,0,.34), 0 0 20px rgba(255,150,196,.22)}
  .gbox.lit .rib{box-shadow:0 0 16px rgba(255,226,170,.75)}
  .gbox.lit .bow{filter:drop-shadow(0 0 14px rgba(255,230,186,.9))}
  .gbox.lit::after{
    content:"";position:absolute;left:50%;top:-26%;width:9px;height:9px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,#fff8ee,rgba(255,226,180,.45) 48%,rgba(255,220,170,0) 76%);
    animation:sparkFloat 4.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sparkFloat{
    0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
    35%{opacity:.9}
    70%{opacity:.5}
    100%{opacity:0;transform:translate(-50%,-16px) scale(1.1)}
  }
  /* 正在打开的那一个稍微站起来 */
  .gbox.open{transform:translateY(calc(var(--dy) * -1 - var(--arc, 0px) - 12px)) scale(calc(var(--sc, 1) * 1.07)) rotate(var(--rot, 0deg))}

  .gbox .glow{
    position:absolute;inset:-46%;border-radius:50%;pointer-events:none;z-index:-1;
    background:radial-gradient(circle, rgba(255,120,170,.30), rgba(255,80,150,0) 68%);
    opacity:.55;
  }
  .gbox .body{
    position:absolute;inset:0;border-radius:3px 3px 5px 5px;
    background:
      linear-gradient(104deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 26%),
      linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.16),
      inset 0 -12px 24px rgba(0,0,0,.44),
      inset 0 8px 16px rgba(255,255,255,.10);
  }
  .gbox .body::after{
    content:"";position:absolute;left:0;right:0;top:34%;height:17%;z-index:2;
    background:linear-gradient(180deg, #a87c3c 0%, #ffe2a6 22%, #fff8e2 48%, #ffdda0 74%, #a87c3c 100%);
    box-shadow:0 0 10px rgba(255,214,150,.30);
  }
  .gbox .lid{
    position:absolute;left:-8%;right:-8%;top:0;height:26%;
    border-radius:4px;
    background:
      linear-gradient(104deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,0) 32%),
      linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.22),
      inset 0 -8px 16px rgba(0,0,0,.38),
      0 7px 18px rgba(0,0,0,.4);
  }
  .gbox .rib{
    position:absolute;left:50%;top:0;bottom:0;width:16%;
    transform:translateX(-50%);z-index:2;
    background:linear-gradient(90deg, #a87c3c, #ffe2a6 30%, #fff8e2 50%, #ffdda0 70%, #a87c3c);
    box-shadow:0 0 12px rgba(255,214,150,.32);
  }
  .gbox .bow{
    position:absolute;left:50%;top:-15%;width:80%;height:34%;
    transform:translateX(-50%);z-index:3;
    filter:drop-shadow(0 3px 9px rgba(0,0,0,.42));
  }
  .gbox .bow::before, .gbox .bow::after{
    content:"";position:absolute;top:16%;width:52%;height:62%;
    border-radius:50% 50% 38% 38% / 62% 62% 32% 32%;
    background:linear-gradient(158deg, #fffbe6 0%, #ffe1a4 32%, #f0bd72 62%, #b8843a 100%);
    box-shadow:inset 0 -3px 8px rgba(140,95,30,.42), inset 0 3px 6px rgba(255,248,220,.5);
  }
  .gbox .bow::before{left:0;transform:rotate(-24deg);transform-origin:right center}
  .gbox .bow::after{right:0;transform:rotate(24deg);transform-origin:left center}
  .gbox .bow .knot{
    position:absolute;left:50%;top:34%;width:22%;height:44%;
    transform:translateX(-50%);border-radius:50%;
    background:linear-gradient(160deg,#fff8e0,#f5c67c 50%,#bd8a3f);
    box-shadow:inset 0 -2px 6px rgba(130,90,30,.45);
  }
  .gbox:hover .bow{filter:drop-shadow(0 0 16px rgba(255,214,158,.8))}

  /* 点开后的那一页：图 + 可改的字 */
  #card{
    position:absolute;left:50%;top:45%;
    transform:translate(-50%,-50%) scale(.86);
    width:min(74vw,42vh);aspect-ratio:3/4;
    border-radius:16px;overflow:hidden;background:#08050a;
    box-shadow:
      0 30px 84px rgba(0,0,0,.82),
      0 0 0 1px rgba(255,214,232,.20),
      0 0 70px rgba(255,60,140,.20);
    opacity:0;pointer-events:none;z-index:5;
    transition:opacity .5s ease, transform .72s cubic-bezier(.16,.74,.16,1);
  }
  #card.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}

  #card .pic{position:absolute;inset:0}
  #card .pic img{width:100%;height:100%;object-fit:cover;display:block}
  #card .pic::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top, rgba(3,1,6,.95) 0%, rgba(3,1,6,.70) 30%, rgba(3,1,6,.05) 62%, rgba(3,1,6,0) 84%);
  }
  #card .cap{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:7% 7% 8.5%;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#ffdcea;
  }
  #card .cap .h{
    font-size:min(4.4vmin,22px);font-weight:600;letter-spacing:.05em;
    margin:0 0 .34em;white-space:pre-wrap;
    color:#fff2f8;outline:none;
    text-shadow:0 0 18px rgba(255,86,164,.55), 0 2px 10px rgba(0,0,0,.6);
  }
  #card .cap .d{
    font-size:min(2.7vmin,14.5px);font-weight:300;line-height:1.75;letter-spacing:.02em;
    color:rgba(255,222,236,.86);outline:none;margin:0;white-space:pre-wrap;
  }
  #card .cap [contenteditable]:focus{
    background:rgba(255,120,180,.13);
    box-shadow:0 0 0 1px rgba(255,150,200,.42), 0 0 22px rgba(255,80,150,.22);
    border-radius:6px;padding:0 .22em;margin:0 -.22em;
  }

  #cardTip{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;
    padding:.34em .86em;border-radius:999px;white-space:nowrap;
    background:rgba(6,2,10,.58);border:1px solid rgba(255,204,228,.26);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:min(2vmin,11px);letter-spacing:.12em;color:rgba(255,214,234,.72);
    pointer-events:none;
    opacity:0;transition:opacity .9s ease .4s;
  }
  #card.on #cardTip{opacity:1}

  #cardClose{
    position:absolute;right:9px;top:9px;z-index:4;
    width:30px;height:30px;border-radius:50%;cursor:pointer;
    background:rgba(8,3,10,.6);color:#ffd9ea;
    border:1px solid rgba(255,200,226,.32);
    -webkit-appearance:none;appearance:none;
    font-size:15px;line-height:1;padding:0;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:background .3s ease, transform .3s ease;
  }
  #cardClose:hover{background:rgba(255,80,150,.34);transform:scale(1.06)}

  /* 整页飘雪 */
  #snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

  /* 五个都拆开之后，中间缓缓浮出的一句 */
  #wish{
    position:absolute;left:0;right:0;top:44%;text-align:center;z-index:4;
    pointer-events:none;
    opacity:0;transform:translateY(26px) scale(.985);
    transition:
      opacity 4.2s cubic-bezier(.25,.6,.3,1) .5s,
      transform 5s cubic-bezier(.16,.74,.16,1) .5s;
  }
  #wish.on{opacity:1;transform:translateY(0) scale(1)}
  #wish .t{
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    font-weight:300;
    font-size:clamp(26px, 7.2vmin, 54px);line-height:1.1;
    letter-spacing:.36em;text-indent:.36em;
    color:#ffeaf3;white-space:nowrap;
    text-shadow:
      0 0 24px rgba(255,120,182,.80),
      0 0 64px rgba(255,62,146,.45),
      0 0 132px rgba(255,30,110,.22);
    transition:letter-spacing 6s cubic-bezier(.16,.74,.16,1) .4s;
  }
  #wish.on .t{letter-spacing:.16em;text-indent:.16em}
  #wish .line{
    display:block;margin:1.05em auto 0;width:min(30vw,180px);height:1px;
    background:linear-gradient(90deg, rgba(255,180,215,0), rgba(255,180,215,.66), rgba(255,180,215,0));
    transform:scaleX(.4);opacity:0;
    transition:transform 4.4s cubic-bezier(.16,.74,.16,1) 1.2s, opacity 3.4s ease 1.2s;
  }
  #wish.on .line{transform:scaleX(1);opacity:1}

  #giftHint{
    position:absolute;left:0;right:0;bottom:1.7vh;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-weight:300;font-size:clamp(10.5px, 2.5vmin, 12px);letter-spacing:.14em;
    color:rgba(255,206,228,.50);pointer-events:none;
  }

  #filePick{display:none}

  /* 树这边播完之后，给一句"点一下"的提示 */
  #nextHint{
    position:fixed;left:0;right:0;bottom:4vh;z-index:8;
    text-align:center;pointer-events:none;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.5s ease, transform 1.5s cubic-bezier(.18,.72,.18,1);
  }
  #nextHint span{
    display:inline-block;
    padding:.72em 1.5em .72em 1.78em;
    border-radius:999px;
    background:rgba(6,2,10,.62);
    border:1px solid rgba(255,204,228,.34);
    box-shadow:0 0 22px rgba(255,80,150,.20), 0 0 60px rgba(255,40,120,.10);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-weight:300;font-size:min(2.8vmin,16px);letter-spacing:.26em;
    color:#ffe3f0;
    text-shadow:0 0 14px rgba(255,96,172,.65), 0 0 38px rgba(255,60,150,.32);
  }
  #nextHint.show{opacity:1;transform:translateY(0);animation:hintBreath 2.8s ease-in-out infinite}
  @keyframes hintBreath{0%,100%{opacity:.66}50%{opacity:1}}

  /* 树全部亮起来之后浮现的文字 */
  #words{
    position:fixed;left:0;right:0;top:0;
    pointer-events:none;text-align:center;
    opacity:0;transform:translateY(18px);
    transition:opacity 1.2s ease, transform 1.5s cubic-bezier(.18,.72,.18,1);
    will-change:opacity,transform;
  }
  #words.show{opacity:1;transform:translateY(0)}
  #words .w1{
    font-family:"Great Vibes","Segoe Script",cursive;
    color:#fff0f7;line-height:1;white-space:nowrap;
    text-shadow:0 0 16px rgba(255,64,150,.9), 0 0 42px rgba(255,38,126,.6), 0 0 92px rgba(255,16,104,.36);
  }
  #words .w2{
    margin-top:.62em;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-weight:300;color:#ffd9ea;letter-spacing:.14em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(255,96,172,.5), 0 0 30px rgba(255,60,150,.3);
  }
  #words .w2 b{
    font-weight:500;font-size:1.09em;color:#fff3f8;letter-spacing:.01em;
    text-shadow:0 0 14px rgba(255,120,190,.90), 0 0 38px rgba(255,60,150,.55);
  }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="words"><div class="w1">Merry Christmas</div><div class="w2">圣诞倒计时 · <b>-- 天 --:--:--</b></div></div>
<div id="veil"><button id="go" type="button" aria-label="进入">进入</button></div>
<div id="nextHint"><span>轻触画面 · 聆听下一幕</span></div>

<div id="discStage">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="discTitle">Merry Christmas</div>

  <div id="discHolder">
    <div class="ring"></div>
    <div id="discGlow"></div>
    <div id="discWrap">
      <div id="disc"></div>
      <div id="label">
        <div class="hole"></div>
        <div class="t">喜欢你</div>
        <div class="s">陈洁仪</div>
      </div>
      <div id="sheen"></div>
    </div>
  </div>
  <div id="discMeta">正在播放 · 喜欢你（现场版）</div>
  <button id="discPlay" type="button" aria-label="播放或暂停音乐"><span class="ico">▶</span><span class="tx">轻点播放</span></button>

  <canvas id="snow" aria-hidden="true"></canvas>

  <div id="giftRow">
    <button class="gbox" type="button" data-i="0" aria-label="打开第一份礼物" style="--w:10.6vmin;--dy:0px;--arc:0px;--sc:.92;--rot:-3deg;--c1:#f0566a;--c2:#a41c33;--dly:0s">
      <span class="glow"></span><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="bow"><span class="knot"></span></span>
    </button>
    <button class="gbox" type="button" data-i="1" aria-label="打开第二份礼物" style="--w:7.4vmin;--dy:11px;--arc:26px;--sc:.86;--rot:2deg;--c1:#6ebcff;--c2:#21589e;--dly:.9s">
      <span class="glow"></span><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="bow"><span class="knot"></span></span>
    </button>
    <button class="gbox" type="button" data-i="2" aria-label="打开第三份礼物" style="--w:13vmin;--dy:3px;--arc:46px;--sc:1.06;--rot:0deg;--c1:#ff7ec0;--c2:#a52a6c;--dly:.45s">
      <span class="glow"></span><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="bow"><span class="knot"></span></span>
    </button>
    <button class="gbox" type="button" data-i="3" aria-label="打开第四份礼物" style="--w:8.4vmin;--dy:15px;--arc:26px;--sc:.88;--rot:-2deg;--c1:#f8cf72;--c2:#a3772a;--dly:1.35s">
      <span class="glow"></span><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="bow"><span class="knot"></span></span>
    </button>
    <button class="gbox" type="button" data-i="4" aria-label="打开第五份礼物" style="--w:9.8vmin;--dy:6px;--arc:2px;--sc:.94;--rot:3deg;--c1:#b083f6;--c2:#552b9d;--dly:1.8s">
      <span class="glow"></span><span class="body"></span><span class="lid"></span><span class="rib"></span><span class="bow"><span class="knot"></span></span>
    </button>
  </div>
  <div id="giftHint">轻点一个礼物盒 · 里面有一张图和一段话</div>

  <div id="wish">
    <div class="t">岁岁平安</div>
    <div class="line"></div>
  </div>

  <div id="card">
    <div class="pic"><img src="https://aka.doubaocdn.com/s/6IRShLxcXx" alt="" draggable="false"></div>
    <div class="cap">
      <div class="h" contenteditable="plaintext-only" spellcheck="false">灯亮起来的那一刻</div>
      <div class="d" contenteditable="plaintext-only" spellcheck="false">你说想看一棵真的树，于是我把整片夜都点亮了。</div>
    </div>
    <div id="cardTip">点图片换图 · 点文字改字</div>
    <button id="cardClose" type="button" aria-label="关闭">×</button>
  </div>

  <input id="filePick" type="file" accept="image/*">
</div>
<audio id="song" preload="auto" loop>
  <source src="./song.mp3" type="audio/mpeg">
  <source src="https://sakura-jj-zz.github.io/christmas-tree/song.mp3" type="audio/mpeg">
  <source src="https://aka.doubaocdn.com/s/tVeB8iqclT" type="audio/mpeg">
  <source src="https://aka.doubaocdn.com/s/ZQJgfxHURO" type="audio/mpeg">
</audio>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var go = document.getElementById('go');
  var words = document.getElementById('words');
  var countNode = words ? words.querySelector('.w2 b') : null;

  /* 第二页（唱片）相关 */
  var song = document.getElementById('song');
  var discStage = document.getElementById('discStage');
  var discGlow = document.getElementById('discGlow');
  var discWrap = document.getElementById('discWrap');
  var nextHint = document.getElementById('nextHint');
  var discOn = false, hintShown = false;
  var actx = null, analyser = null, freqData = null;

  /* 音频要在用户点「进入」时先"播一下再停"，之后动画播完自动 play 才不会被拦 */
  function unlockAudio(){
    if(!song) return;
    try{
      song.volume = 0;
      var p = song.play();
      if(p && p.then){
        p.then(function(){
          song.pause();
          try{ song.currentTime = 0; }catch(e){}
          song.volume = 1;
        }).catch(function(){ song.volume = 1; });
      } else {
        song.pause(); song.currentTime = 0; song.volume = 1;
      }
    }catch(e){ song.volume = 1; }

    if(actx || !song) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
      analyser = actx.createAnalyser();
      analyser.fftSize = 128;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      var src = actx.createMediaElementSource(song);
      src.connect(analyser);
      analyser.connect(actx.destination);
      if(actx.state === 'suspended') actx.resume();
    }catch(e){ actx = null; analyser = null; }
  }

  /* ── 播放控制：自动播放被浏览器拦住时，用这颗按钮出声 ─────────────── */
  var discPlayBtn = document.getElementById('discPlay');
  var discMetaEl  = document.getElementById('discMeta');

  function setPlayUI(playing){
    if(!discPlayBtn) return;
    discPlayBtn.classList.add('show');
    discPlayBtn.classList.toggle('pulse', !playing);
    var ic = discPlayBtn.querySelector('.ico'), tx = discPlayBtn.querySelector('.tx');
    if(ic) ic.textContent = playing ? '‖' : '▶';
    if(tx) tx.textContent = playing ? '暂停' : '轻点播放';
    if(discMetaEl) discMetaEl.textContent = playing
      ? '正在播放 · 喜欢你（现场版）'
      : '还没出声 · 点上面那颗按钮';
  }

  function startSong(){
    if(!song) return;
    song.volume = 1;
    try{
      var p = song.play();
      if(p && p.then){
        p.then(function(){ setPlayUI(true); }).catch(function(){ setPlayUI(false); });
      } else { setPlayUI(true); }
    }catch(e){ setPlayUI(false); }
    if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  }

  /* 音频兜底：直链/CDN 打开时先走 CDN，失败就换下一个源 */
  var SONG_FALLBACK = [
    'https://aka.doubaocdn.com/s/tVeB8iqclT',
    'https://sakura-jj-zz.github.io/christmas-tree/song.mp3',
    'https://aka.doubaocdn.com/s/ZQJgfxHURO'
  ];
  var fbIdx = 0;
  if(song){
    var isCdn = /doubaocdn|byteimg|feishucdn/.test(location.hostname);
    if(isCdn){
      song.src = SONG_FALLBACK[0];
      try{ song.load(); }catch(e){}
    }
    song.addEventListener('error', function(){
      if(fbIdx < SONG_FALLBACK.length){
        try{ song.src = SONG_FALLBACK[fbIdx]; fbIdx++; song.load(); }catch(e){}
      }
      setPlayUI(false);
    });
    song.addEventListener('play',  function(){ setPlayUI(true);  });
    song.addEventListener('pause', function(){ setPlayUI(false); });
  }
  if(discPlayBtn){
    discPlayBtn.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(song.paused) startSong(); else song.pause();
    });
  }

  function showHint(){
    if(hintShown || !nextHint) return;
    hintShown = true;
    nextHint.classList.add('show');
  }

  /* 第二页 → 第三页：等提示出来后，点一下画面才翻过去 */
  function tryNext(){
    if(!started || discOn || !hintShown) return;
    if(nextHint) nextHint.classList.remove('show');
    showDisc(false);
  }

  function showDisc(instant){
    if(!discStage) return;
    if(discOn && !instant) return;
    discOn = true;
    if(instant){
      discStage.classList.add('no-anim');
      discStage.style.transition = 'none';
      discWrap.style.transition = 'none';
      discStage.style.opacity = '1';
      discWrap.style.opacity = '1';
      discWrap.style.transform = 'scale(1)';
      var t1 = document.getElementById('discTitle');
      var t2 = document.getElementById('discMeta');
      if(t1){ t1.style.transition='none'; t1.style.opacity='1'; }
      if(t2){ t2.style.transition='none'; t2.style.opacity='1'; }
    }
    discStage.classList.add('on');
    snowStart();
    if(litCount() >= (boxes.length || 5)) setTimeout(showWish, 1800);
    if(!instant && song){
      startSong();
    }
    if(song) setTimeout(function(){ setPlayUI(!song.paused); }, instant ? 600 : 1600);
  }

  /* 让外圈光晕跟着音乐音量起伏 */
  function pulseDisc(){
    if(!analyser || !freqData || !discGlow || !discOn) return;
    analyser.getByteFrequencyData(freqData);
    var sum = 0;
    for(var i=0;i<freqData.length;i++) sum += freqData[i];
    var lvl = sum/(freqData.length*255);
    discGlow.style.opacity = (0.34 + lvl*0.86).toFixed(3);
    discGlow.style.transform = 'translate(-50%,-50%) scale(' + (1 + lvl*0.10).toFixed(3) + ')';
  }

  /* ── 地上的礼物盒：点一下，打开属于它的那张图和那段字 ───────────── */
  var giftRow   = document.getElementById('giftRow');
  var cardEl    = document.getElementById('card');
  var cardImg   = cardEl ? cardEl.querySelector('.pic img') : null;
  var cardH     = cardEl ? cardEl.querySelector('.cap .h') : null;
  var cardD     = cardEl ? cardEl.querySelector('.cap .d') : null;
  var cardClose = document.getElementById('cardClose');
  var filePick  = document.getElementById('filePick');
  var fx        = document.getElementById('fx');
  var fxc       = fx ? fx.getContext('2d') : null;
  var boxes     = giftRow ? Array.prototype.slice.call(giftRow.querySelectorAll('.gbox')) : [];
  var curCard = -1, pickIdx = 0;

  /* 五个盒子里默认装的东西：一张图 + 一段话 */
  var GIFTS = [
    {img:'https://aka.doubaocdn.com/s/6IRShLxcXx', h:'第一份 · 灯', d:'你说想看一棵真的树，于是我把整片夜都点亮了。'},
    {img:'https://aka.doubaocdn.com/s/PbzSUIblrM', h:'第二份 · 雪', d:'隔着一层玻璃，世界安静下来，只剩杯子里那点热气。'},
    {img:'https://aka.doubaocdn.com/s/9VrhIXH7Ja', h:'第三份 · 纸', d:'今年这一页很短，但每一个字都留给你。'},
    {img:'https://aka.doubaocdn.com/s/7nP39KrQhN', h:'第四份 · 火', d:'炉子烧得很旺，我给你留了半张毯子。'},
    {img:'https://aka.doubaocdn.com/s/R5qTfzRLEu', h:'第五份 · 你', d:'前面的都可以不要，这一份只想亲手递给你。'}
  ];

  var LS_P = 'xm_photo_', LS_H = 'xm_head_', LS_D = 'xm_desc_';
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* 上传的图先压到 1400px 的 jpg 再存，免得把 localStorage 撑爆 */
  function toDataURL(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var mw = 1400, w = im.width, h = im.height;
        if(Math.max(w,h) > mw){ var k = mw/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = function(){ cb(null); };
      im.src = fr.result;
    };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(file);
  }

  /* 粒子层 */
  var FW = 0, FH = 0, FXDPR = 1, PARTS = [], RIPPLES = [], fxRaf = 0, fxPrev = 0;
  function fxResize(){
    if(!fx || !fxc) return;
    FXDPR = Math.min(2, window.devicePixelRatio || 1);
    FW = window.innerWidth; FH = window.innerHeight;
    fx.width = Math.round(FW*FXDPR); fx.height = Math.round(FH*FXDPR);
    fx.style.width = FW+'px'; fx.style.height = FH+'px';
    fxc.setTransform(FXDPR,0,0,FXDPR,0,0);
  }

  function burstAt(x, y, opt){
    if(!fxc) return;
    opt = opt || {};
    var n = opt.n || 120;
    var spread = opt.spread || Math.max(FW,FH)*0.10;
    for(var i=0;i<n;i++){
      var a = (i/n)*TAU + rnd(-0.06,0.06);
      var sp = spread*rnd(0.30, 1.15);
      PARTS.push({
        x: x, y: y,
        vx: Math.cos(a)*sp*1.9,
        vy: Math.sin(a)*sp*1.9 - rnd(10, 70),
        life: 0, dur: rnd(0.95, 1.9) * (opt.durK || 1),
        sz: rnd(0.7, 2.4) * (opt.szK || 1),
        g: (opt.g === undefined ? 90 : opt.g),
        c: (opt.gold
            ? ['255,244,214','255,232,180','255,210,238','238,246,255','255,222,160'][(Math.random()*5)|0]
            : DECO[(Math.random()*DECO.length)|0]),
        ph: rnd(0, TAU)
      });
    }
    if(!fxRaf){ fxPrev = 0; fxRaf = requestAnimationFrame(fxLoop); }
  }

  function rippleAt(x, y, r0, r1, dur){
    RIPPLES.push({x:x, y:y, r:r0, r0:r0, r1:r1, life:0, dur:dur||1.0});
    if(!fxRaf){ fxPrev = 0; fxRaf = requestAnimationFrame(fxLoop); }
  }

  function fxLoop(ts){
    if(!fxc){ fxRaf = 0; return; }
    var dt = fxPrev ? Math.min(0.06, (ts-fxPrev)/1000) : 0.016;
    fxPrev = ts;
    fxc.clearRect(0,0,FW,FH);
    fxc.globalCompositeOperation = 'lighter';

    for(var i=PARTS.length-1;i>=0;i--){
      var p = PARTS[i];
      p.life += dt;
      if(p.life >= p.dur){ PARTS.splice(i,1); continue; }
      var k = 1 - p.life/p.dur;
      p.vy += p.g*dt;
      p.vx *= (1 - 1.9*dt);
      p.vy *= (1 - 1.6*dt);
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      var tw = 0.72 + 0.28*Math.sin(p.life*13 + p.ph);
      fxc.fillStyle = 'rgba('+p.c+','+ (0.92*k*tw) +')';
      fxc.beginPath(); fxc.arc(p.x, p.y, p.sz*(0.5+0.9*k), 0, TAU); fxc.fill();
      fxc.fillStyle = 'rgba('+p.c+','+ (0.16*k) +')';
      fxc.beginPath(); fxc.arc(p.x, p.y, p.sz*4.4*k, 0, TAU); fxc.fill();
    }

    for(var j=RIPPLES.length-1;j>=0;j--){
      var r = RIPPLES[j];
      r.life += dt;
      if(r.life >= r.dur){ RIPPLES.splice(j,1); continue; }
      var q = r.life/r.dur;
      var rr = r.r0 + (r.r1-r.r0)*easeOutCubic(q);
      var ra = (1-q)*(1-q)*0.38;
      fxc.strokeStyle = 'rgba(255,190,226,'+ ra +')';
      fxc.lineWidth = 1.1;
      fxc.beginPath(); fxc.arc(r.x, r.y, rr, 0, TAU); fxc.stroke();
      fxc.strokeStyle = 'rgba(255,120,186,'+ (ra*0.6) +')';
      fxc.lineWidth = 2.2;
      fxc.beginPath(); fxc.arc(r.x, r.y, rr*0.86, 0, TAU); fxc.stroke();
    }

    fxc.globalCompositeOperation = 'source-over';
    if(PARTS.length || RIPPLES.length){ fxRaf = requestAnimationFrame(fxLoop); }
    else { fxRaf = 0; fxPrev = 0; fxc.clearRect(0,0,FW,FH); }
  }

  function cardBurst(x, y, size){
    burstAt(x, y, {n: 112, spread: size*0.82});
    rippleAt(x, y, size*0.16, size*0.70, 0.95);
  }

  /* 打开第 i 个盒子：把它的图和字填进卡片 */
  function openCard(i){
    var g = GIFTS[i];
    if(!g || !cardEl) return;
    curCard = i; pickIdx = i;
    var sp = lsGet(LS_P + i), hh = lsGet(LS_H + i), dd = lsGet(LS_D + i);
    if(cardImg) cardImg.src = sp || g.img;
    if(cardH) cardH.textContent = hh || g.h;
    if(cardD) cardD.textContent = dd || g.d;
    cardEl.classList.add('on');
    boxes.forEach(function(b, k){ b.classList.toggle('open', k === i); });
    lightUp(i);
    if(boxes[i]){
      var r = boxes[i].getBoundingClientRect();
      cardBurst(r.left + r.width/2, r.top + r.height*0.4, Math.max(r.width, r.height));
    }
  }

  function closeCard(){
    if(!cardEl || !cardEl.classList.contains('on')) return;
    cardEl.classList.remove('on');
    boxes.forEach(function(b){ b.classList.remove('open'); });
    curCard = -1;
  }

  /* 拆开过的盒子一直亮着，底部那行字会跟着数进度 */
  var LIT_KEY = 'xm_lit', litSet = {};
  var giftHint = document.getElementById('giftHint');

  function loadLit(){
    try{
      var arr = JSON.parse(localStorage.getItem(LIT_KEY) || '[]');
      if(arr && arr.length){
        arr.forEach(function(i){
          litSet[i] = 1;
          if(boxes[i]) boxes[i].classList.add('lit');
        });
      }
    }catch(e){}
  }
  function saveLit(){
    try{
      var arr = [];
      for(var k in litSet){ if(litSet.hasOwnProperty(k)) arr.push(Number(k)); }
      localStorage.setItem(LIT_KEY, JSON.stringify(arr));
    }catch(e){}
  }
  function litCount(){
    var n = 0;
    boxes.forEach(function(b){ if(b.classList.contains('lit')) n++; });
    return n;
  }
  function updateHint(){
    if(!giftHint) return;
    var n = litCount(), total = boxes.length || 5;
    if(n <= 0) giftHint.textContent = '轻点一个礼物盒 · 里面有一张图和一段话';
    else if(n < total) giftHint.textContent = '已经拆开 ' + n + ' / ' + total + ' 份 · 还有 ' + (total-n) + ' 个在等你';
    else giftHint.textContent = '5 / 5 · 都拆开了';
  }
  function lightUp(i){
    if(!boxes[i]) return;
    boxes[i].classList.add('lit');
    litSet[i] = 1;
    saveLit();
    updateHint();
    if(litCount() >= boxes.length) setTimeout(showWish, 700);
  }

  /* 五个都拆开之后：中间缓缓浮出一句话，只留文字，不撒星屑 */
  var wishEl = document.getElementById('wish');
  var wishOn = false;

  function showWish(){
    if(wishOn || !wishEl) return;
    wishOn = true;
    wishEl.classList.add('on');
  }

  boxes.forEach(function(b, i){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      openCard(i);
    });
  });

  if(cardClose) cardClose.addEventListener('click', function(e){ e.stopPropagation(); closeCard(); });

  /* 点卡片以外的地方就把它收回去 */
  if(discStage){
    discStage.addEventListener('click', function(e){
      if(!cardEl || !cardEl.classList.contains('on')) return;
      if(e.target.closest && (e.target.closest('#card') || e.target.closest('.gbox'))) return;
      closeCard();
    });
  }

  /* 点卡片里的图 = 换一张本地图片 */
  if(cardImg){
    cardImg.addEventListener('click', function(e){
      e.stopPropagation();
      if(curCard < 0) return;
      pickIdx = curCard;
      if(filePick) filePick.click();
    });
  }

  if(filePick){
    filePick.addEventListener('change', function(){
      var f = filePick.files && filePick.files[0];
      filePick.value = '';
      if(!f || pickIdx < 0) return;
      toDataURL(f, function(url){
        if(!url) return;
        if(cardImg && curCard === pickIdx) cardImg.src = url;
        try{ localStorage.setItem(LS_P + pickIdx, url); }catch(err){}
        var r = cardEl ? cardEl.getBoundingClientRect() : null;
        if(r) cardBurst(r.left + r.width/2, r.top + r.height*0.52, Math.max(r.width, r.height)*0.62);
      });
    });
  }

  /* 改字即时存到本地，下次打开还是你写的 */
  if(cardH) cardH.addEventListener('input', function(){ if(curCard >= 0) lsSet(LS_H + curCard, cardH.textContent); });
  if(cardD) cardD.addEventListener('input', function(){ if(curCard >= 0) lsSet(LS_D + curCard, cardD.textContent); });

  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeCard();
  });

  loadLit();
  updateHint();

  /* 调试：?wish=1 直接看那句祝福 */
  if(/[?&]wish=1/.test(location.search)) setTimeout(showWish, 1200);

  /* ── 整页飘雪（第三页自己的一层） ───────────── */
  var snowCv = document.getElementById('snow');
  var sctx = snowCv ? snowCv.getContext('2d') : null;
  var SW = 0, SH = 0, SDPR = 1, FLAKES = [], snowRaf = 0, snowPrev = 0;

  function buildFlakes(){
    var n = clamp(Math.round(SW*SH/8200), 60, 170);
    FLAKES.length = 0;
    for(var i=0;i<n;i++){
      FLAKES.push({
        x: rnd(0,SW), y: rnd(-SH, SH),
        r: rnd(0.6, 2.6),
        vy: rnd(16, 58),
        amp: rnd(5, 24),
        ph: rnd(0,TAU),
        sp: rnd(0.6, 2.0)
      });
    }
  }

  function snowResize(){
    if(!snowCv || !sctx) return;
    SDPR = Math.min(2, window.devicePixelRatio || 1);
    SW = window.innerWidth; SH = window.innerHeight;
    snowCv.width = Math.round(SW*SDPR); snowCv.height = Math.round(SH*SDPR);
    snowCv.style.width = SW+'px'; snowCv.style.height = SH+'px';
    sctx.setTransform(SDPR,0,0,SDPR,0,0);
    buildFlakes();
  }

  function snowLoop(ts){
    if(!sctx){ snowRaf = 0; return; }
    var dt = snowPrev ? Math.min(0.05, (ts-snowPrev)/1000) : 0.016;
    snowPrev = ts;
    sctx.clearRect(0,0,SW,SH);
    sctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<FLAKES.length;i++){
      var f = FLAKES[i];
      f.y += f.vy*dt;
      f.ph += f.sp*dt;
      if(f.y > SH + 14){ f.y = -14; f.x = rnd(0,SW); }
      var fx2 = f.x + Math.sin(f.ph)*f.amp;
      if(f.r > 1.95){
        sctx.fillStyle = 'rgba(220,236,255,.18)';
        sctx.beginPath(); sctx.arc(fx2, f.y, f.r*2.9, 0, TAU); sctx.fill();
      }
      sctx.fillStyle = 'rgba(242,249,255,.74)';
      sctx.beginPath(); sctx.arc(fx2, f.y, f.r, 0, TAU); sctx.fill();
    }
    sctx.globalCompositeOperation = 'source-over';
    snowRaf = requestAnimationFrame(snowLoop);
  }

  function snowStart(){
    if(!sctx) return;
    if(!snowRaf){ snowPrev = 0; snowRaf = requestAnimationFrame(snowLoop); }
  }

  /* 圣诞倒计时：算到最近的一个 12 月 25 日 00:00（本地时间） */
  function nextXmas(){
    var now = new Date();
    var y = now.getFullYear();
    var t = new Date(y, 11, 25, 0, 0, 0);
    if(now.getTime() >= t.getTime()) t = new Date(y+1, 11, 25, 0, 0, 0);
    return t;
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function tickCountdown(){
    if(!countNode) return;
    var left = nextXmas().getTime() - new Date().getTime();
    if(left < 0) left = 0;
    var dd = Math.floor(left/86400000);
    var hh = Math.floor(left/3600000) % 24;
    var mm = Math.floor(left/60000) % 60;
    var ss = Math.floor(left/1000) % 60;
    countNode.textContent = dd + ' 天 ' + pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);

  var TAU = Math.PI*2;
  var W = 0, H = 0, DPR = 1;
  var cx = 0, cy0 = 0, topY = 0, groundY = 0, treeH = 0, baseR = 0, Rmax = 0, starR = 0;

  var P = [];              /* 粒子 */
  var G = [];              /* 礼物盒粒子 */
  var SNOW = [];           /* 飘雪 */
  var started = false, running = false, t0 = 0, rafId = 0, outStarted = false;
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* 调帧预览：?at=1.6 会把动画定格在那一秒，方便逐帧检查（正常访问不带这个参数） */
  var FREEZE = 0;
  var qm = (location.search || '').match(/[?&]at=([0-9.]+)/);
  if(qm) FREEZE = parseFloat(qm[1]);

  /* 时间轴（秒）—— 不做跳转，这场动画就是全部内容 */
  var T_STAR  = 0.00;   /* 第一颗星升起 */
  var T_BURST = 0.72;   /* 爆炸起点 */
  var T_GATHER= 1.90;   /* 开始聚拢 */
  var T_GDUR  = 2.50;   /* 聚拢用时 */
  var T_GROW  = 4.45;   /* 由下往上铺满粒子 */
  var T_GROWD = 3.55;   /* 铺满用时 */
  var T_GIFT  = 7.55;   /* 树脚开始由粒子堆出礼物盒 */
  var T_GIFTD = 1.35;   /* 堆出用时 */
  var T_TEXT  = 9.00;   /* 文字浮现 */
  var T_HINT  = 10.30;  /* 树这边播完，浮出"轻触画面"的提示 */
  var T_DISC  = 11.30;  /* 提示出现后，点一下就能翻到唱片页 */

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
  function easeInOutCubic(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

  var COLORS = ['255,249,238','255,240,214','255,226,186','250,252,255','255,214,232'];
  var DECO   = ['255,206,104','255,100,152','128,228,255','204,164,255','255,168,92'];

  function build(){
    cx = W*0.5;
    topY = H*0.205;
    groundY = H*0.890;
    treeH = groundY - topY;
    baseR = treeH*0.345;
    cy0 = H*0.360;              /* 星星 / 爆炸中心 */
    Rmax = Math.max(W,H)*0.34;
    starR = Math.min(W,H)*0.075;

    var N = clamp(Math.round(W*H/190), 3000, 5600);
    var turns = 11.5;
    P.length = 0;

    for(var i=0;i<N;i++){
      var u = Math.pow(i/(N-1), 0.78);       /* 0 = 树顶, 1 = 树脚；底部面积大，粒子更多 */
      var yBase = topY + treeH*u;
      var coneR = baseR*(0.055 + 0.945*Math.pow(u, 1.12));
      var inner = (i % 5) >= 3;              /* 40% 落在锥体内部，把圈与圈之间的空隙填满 */
      var tx, ty;

      if(inner){
        var vv = 1 - Math.pow(Math.random(), 0.42);   /* 靠外圈更密一些 */
        var a2 = rnd(0, TAU);
        var r2 = coneR*vv;
        tx = cx + Math.cos(a2)*r2;
        ty = yBase + Math.sin(a2)*r2*0.055 + rnd(-7,7);
      } else {
        var a1 = u*turns*TAU + rnd(-0.26,0.26);
        var r1 = coneR*(0.96 + rnd(-0.05,0.05));
        tx = cx + Math.cos(a1)*r1;
        ty = yBase + Math.sin(a1)*r1*0.075 + rnd(-5,5);
      }

      var isDeco = !inner && (i % 13 === 0);

      P.push({
        tx: tx,
        ty: ty,
        u: u,                                /* 在树上的高度位置，0顶1脚 */
        inner: inner ? 1 : 0,
        deco: isDeco ? 1 : 0,
        frame: (i%8===0) ? 1 : 0,            /* 1 = 先落位的骨架，其余等生长阶段点亮 */
        ang: rnd(0,TAU),                     /* 炸开方向 */
        br: Math.pow(Math.random(), 1.85),   /* 炸开距离系数：中心更密 */
        dly: rnd(0,0.30),                    /* 起爆延迟 */
        sz: (isDeco ? rnd(0.95,1.65) : rnd(0.40,1.45)*(inner?0.9:1)) * (0.58 + 0.42*Math.min(1, u*3.2)),
        c: isDeco ? DECO[(Math.random()*DECO.length)|0] : COLORS[(Math.random()*COLORS.length)|0],
        big: isDeco ? 1 : (Math.random()<0.26),
        trail: Math.random()<0.34,
        ph: rnd(0,TAU),
        lx: null, ly: null
      });
    }

    buildGifts();
    buildSnow();
  }

  /* 飘雪：位置只由时间算出，所以定格某一秒也能正确显示 */
  function buildSnow(){
    SNOW.length = 0;
    var n = clamp(Math.round(W*H/9000), 55, 150);
    for(var i=0;i<n;i++){
      var big = Math.pow(Math.random(), 1.75);      /* 大部分是小雪粒，少量近处的大雪片 */
      SNOW.push({
        x: rnd(-14, W+14),
        y0: rnd(0, H+40),
        amp: rnd(5, 26),
        ph: rnd(0, TAU),
        r: 0.7 + big*2.6,
        sp: 22 + big*90,                            /* 近处的大片落得更快 */
        a: 0.28 + Math.random()*0.62
      });
    }
  }

  function drawSnow(t, mul){
    var span = H + 40;
    for(var i=0;i<SNOW.length;i++){
      var s = SNOW[i];
      var yy = ((s.y0 + t*s.sp) % span) - 20;
      var xx = s.x + Math.sin(t*0.55 + s.ph)*s.amp;
      var a = s.a*(mul || 1);
      if(yy < 0 || yy > H) continue;
      if(s.r > 1.9){
        ctx.fillStyle = 'rgba(222,238,255,'+ (a*0.22) +')';
        ctx.beginPath(); ctx.arc(xx, yy, s.r*2.9, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(240,248,255,'+ (a*0.42) +')';
        ctx.beginPath(); ctx.arc(xx, yy, s.r*1.6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(240,249,255,'+ (a*0.90) +')';
      ctx.beginPath(); ctx.arc(xx, yy, s.r, 0, TAU); ctx.fill();
    }
  }

  /* 树脚用粒子堆起来的礼物盒 */
  function buildGifts(){
    G.length = 0;
    var s = Math.min(W,H);
    var by = groundY + H*0.014;

    giftBox(cx - s*0.225, by,           s*0.112, s*0.070, s*0.052, '236,78,88',   '255,206,132');
    giftBox(cx + s*0.168, by + s*0.004, s*0.088, s*0.056, s*0.042, '86,176,255',  '255,222,150');
    giftBox(cx + s*0.265, by - s*0.002, s*0.062, s*0.042, s*0.030, '236,110,186', '255,232,176');
  }

  function giftBox(gx, gy, w, h, d, boxC, ribC){
    var f = w*0.5;
    var ribH = w*0.085;
    var step = Math.max(1.8, w*0.026);

    function push(x, y, c, sz, dly){
      var onRib = Math.abs(x - gx) < ribH;
      G.push({
        x: x, y: y,
        c: onRib ? ribC : c,
        sz: sz || rnd(0.55,1.10),
        ph: rnd(0,TAU),
        dly: dly !== undefined ? dly : clamp((gy - y)/(h*1.6 + d*0.8)*0.58 + rnd(0,0.22), 0, 0.88)
      });
    }

    var nc = Math.max(6, Math.round(w/step));
    var nr = Math.max(4, Math.round(h/step));
    var nd = Math.max(3, Math.round(d*0.5/step));

    /* 正面 */
    for(var i=0;i<nc;i++){
      var px = (gx-f) + (i+0.5)*w/nc;
      for(var j=0;j<nr;j++){
        push(px + rnd(-1.1,1.1), gy - (j+0.5)*h/nr + rnd(-1.1,1.1), boxC);
      }
    }

    /* 右侧面：向右后上方斜 */
    for(var k=0;k<nd;k++){
      var t2 = (k+0.5)/nd;
      for(var j2=0;j2<nr;j2++){
        push((gx+f) + t2*d*0.5 + rnd(-1.1,1.1),
             gy - (j2+0.5)*h/nr - t2*d*0.5 + rnd(-1.1,1.1), boxC);
      }
    }

    /* 顶面 */
    var nc3 = Math.max(5, Math.round(w/step));
    var nd3 = Math.max(3, Math.round(d*0.5/step));
    for(var m=0;m<nc3;m++){
      for(var n=0;n<nd3;n++){
        var tt = (n+0.5)/nd3;
        push((gx-f) + (m+0.5)*w/nc3 + tt*d*0.5 + rnd(-1.1,1.1),
             (gy-h) - tt*d*0.5 + rnd(-1.1,1.1), boxC);
      }
    }

    /* 顶上的蝴蝶结 */
    var bowR = w*0.115, bx = gx, byy = gy - h - d*0.30;
    for(var q=0;q<2;q++){
      for(var a5=0;a5<TAU;a5+=0.34){
        push(bx + (q?1:-1)*bowR*0.52 + Math.cos(a5)*bowR*0.60,
             byy + Math.sin(a5)*bowR*0.36, ribC, rnd(0.55,1.05), 0.84 + q*0.04);
      }
    }
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
    fxResize();
    snowResize();

    /* 文字排版：居中在树的正上方 */
    if(words){
      words.style.top = (H*0.030).toFixed(1) + 'px';
      var w1 = words.querySelector('.w1');
      var w2 = words.querySelector('.w2');
      if(w1) w1.style.fontSize = Math.min(W*0.092, H*0.066).toFixed(1) + 'px';
      if(w2) w2.style.fontSize = Math.min(W*0.029, H*0.022).toFixed(1) + 'px';
    }
  }

  /* 星芒：核心光斑 + 主光束 + 斜向短芒 */
  function flare(x, y, R, a, rot){
    if(a<=0.01) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(x, y);
    ctx.rotate(rot||0);

    var core = ctx.createRadialGradient(0,0,0,0,0,R*0.52);
    core.addColorStop(0,   'rgba(255,252,242,'+ (a) +')');
    core.addColorStop(0.28,'rgba(255,240,208,'+ (a*0.46) +')');
    core.addColorStop(1,   'rgba(255,222,172,0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0,0,R*0.52,0,TAU); ctx.fill();

    var beams = [[1.0, 0.030, 0.92], [0.56, 0.020, 0.60], [0.30, 0.013, 0.34]];
    for(var b=0;b<beams.length;b++){
      var len = R*beams[b][0], hw = R*beams[b][1], al = a*beams[b][2];
      for(var k=0;k<(b===0?2:4);k++){
        ctx.save();
        ctx.rotate((b===0 ? k*Math.PI/2 : Math.PI/4 + k*Math.PI/2));
        var g = ctx.createLinearGradient(-len,0,len,0);
        g.addColorStop(0,   'rgba(255,242,214,0)');
        g.addColorStop(0.5, 'rgba(255,250,234,'+ al +')');
        g.addColorStop(1,   'rgba(255,242,214,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0,-hw); ctx.lineTo(len,0); ctx.lineTo(0,hw); ctx.lineTo(-len,0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw(t){
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    /* 第一颗星：升起 → 爆炸瞬间被冲开 → 收拢时熄灭 */
    var starIn  = clamp(t/0.62, 0, 1);
    var starOut = 1 - clamp((t - T_GATHER - 0.10)/0.55, 0, 1);
    var sa = (1-Math.pow(1-starIn,2.2)) * starOut;
    var ss = 0.35 + 0.65*(1-Math.pow(1-starIn,3));
    if(sa > 0.005){
      flare(cx, cy0, starR*1.15*ss, sa*0.95, t*0.32);
    }

    /* 爆炸瞬间的整屏闪光：中心亮、边缘暗 */
    var fl = clamp((t - T_BURST)/0.09, 0, 1) * (1 - clamp((t - T_BURST - 0.14)/0.40, 0, 1));
    if(fl > 0.002){
      ctx.globalCompositeOperation = 'lighter';
      var fg = ctx.createRadialGradient(cx, cy0, 0, cx, cy0, Math.max(W,H)*0.62);
      fg.addColorStop(0,   'rgba(255,248,232,'+ (fl*0.22) +')');
      fg.addColorStop(0.42,'rgba(255,238,208,'+ (fl*0.06) +')');
      fg.addColorStop(1,   'rgba(255,232,200,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 爆炸核心的强光 */
    var coreA = clamp((t - T_BURST)/0.12, 0, 1) * (1 - clamp((t - T_BURST - 0.10)/0.46, 0, 1));
    if(coreA > 0.01){
      flare(cx, cy0, starR*1.05, coreA*0.85, t*0.4);
      ctx.globalCompositeOperation = 'lighter';
      ctx.save();
      ctx.translate(cx, cy0);
      var cr = starR*2.6;
      var cg = ctx.createRadialGradient(0,0,0,0,0,cr);
      cg.addColorStop(0,   'rgba(255,250,236,'+ (coreA*0.85) +')');
      cg.addColorStop(0.30,'rgba(255,232,196,'+ (coreA*0.34) +')');
      cg.addColorStop(1,   'rgba(255,220,178,0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0,0,cr,0,TAU); ctx.fill();
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 生长水位：由下往上扫，扫过的粒子才亮起来 */
    var gp = clamp((t - T_GROW)/T_GROWD, 0, 1);
    var gy = groundY - treeH*gp;

    /* 粒子：从星点爆开 → 回吸成暗轮廓 → 由下往上亮成满树 */
    ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<P.length;i++){
      var p = P[i];
      var bt = clamp((t - T_BURST - p.dly)/1.35, 0, 1);
      if(bt <= 0) continue;
      var be = easeOutCubic(bt);
      var mt = clamp((t - T_GATHER - p.dly*0.62)/T_GDUR, 0, 1);
      var me = easeInOutCubic(mt);

      var reach = (0.10 + p.br*0.86) * Rmax * be;
      var ex = cx + Math.cos(p.ang)*reach;
      var ey = cy0 + Math.sin(p.ang)*reach*0.82;

      var x = ex + (p.tx-ex)*me;
      var yb = ey + (p.ty-ey)*me;

      var act = p.frame ? 1 : clamp((p.ty - gy)/42, 0, 1);
      var y = yb + (1-easeOutCubic(act))*22*me;   /* 还没亮起的粒子在目标点下方一点点，随点亮升起 */

      var a = clamp(bt*3.2, 0, 1);
      a *= 0.76 + 0.24*me;                        /* 落位时更实 */
      a *= p.frame ? 0.55 : (0.16 + 0.84*easeOutCubic(act));
      a *= p.inner ? (0.52 + 0.44*(1-me)) : 1;    /* 内部填充平时暗一点；爆开时照样亮 */
      a *= 0.86 + 0.14*Math.sin(t*2.6 + p.ph);    /* 轻轻呼吸闪烁 */
      if(mt < 0.55) a *= 1.30;                    /* 漫天飞散阶段亮一档，看着更有爆开的力量 */

      var s = p.sz*(0.82 + 0.30*me)*(1 + 0.55*(1-me));

      if(p.trail && p.lx !== null){
        var dx = x - p.lx, dy = y - p.ly;
        var d2 = dx*dx + dy*dy;
        if(d2 > 676){                          /* 掉帧导致跨度过大，就不拉长线，直接归位 */
          p.lx = x; p.ly = y;
        } else if(d2 > 6){
          ctx.strokeStyle = 'rgba('+p.c+','+ (a*0.42) +')';
          ctx.lineWidth = Math.max(1, s*0.8);
          ctx.beginPath(); ctx.moveTo(p.lx, p.ly); ctx.lineTo(x, y); ctx.stroke();
          p.lx = x; p.ly = y;
        }
      } else if(p.lx === null){
        p.lx = x; p.ly = y;
      }

      if(p.deco){
        var da = Math.min(1, a*1.30);
        ctx.fillStyle = 'rgba('+p.c+','+ (da*0.26) +')';
        ctx.beginPath(); ctx.arc(x, y, s*3.1, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba('+p.c+','+ (da*0.94) +')';
        ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,'+ (da*0.66) +')';
        ctx.beginPath(); ctx.arc(x, y, s*0.40, 0, TAU); ctx.fill();
      } else {
        if(mt < 0.50){                          /* 漫天飞散阶段给每颗都加一层柔光，看着更亮 */
          ctx.fillStyle = 'rgba('+p.c+','+ (a*0.24) +')';
          ctx.beginPath(); ctx.arc(x, y, s*2.7, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = 'rgba('+p.c+','+ (a*0.92) +')';
        ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
        if(p.big){
          ctx.fillStyle = 'rgba('+p.c+','+ (a*0.20) +')';
          ctx.beginPath(); ctx.arc(x, y, s*4.6, 0, TAU); ctx.fill();
        }
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    /* 生长水位处的一道柔光，跟着水位往上走 */
    if(gp > 0.01 && gp < 0.97){
      var wR = baseR*Math.pow(gp, 1.06)*1.9 + 8;
      var wA = (1 - Math.abs(gp-0.55)*1.15) * 0.52;
      if(wA > 0.01){
        ctx.globalCompositeOperation = 'lighter';
        ctx.save();
        ctx.translate(cx, gy);
        ctx.scale(1, 0.19);
        var wg = ctx.createRadialGradient(0,0,0,0,0,wR);
        wg.addColorStop(0,   'rgba(255,246,228,'+ (wA*0.62) +')');
        wg.addColorStop(0.40,'rgba(255,222,182,'+ (wA*0.26) +')');
        wg.addColorStop(1,   'rgba(255,206,168,0)');
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.arc(0,0,wR,0,TAU); ctx.fill();
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    /* 地面光池：随树往上长，一点点亮起来 */
    var ground = clamp((t - T_GROW - 0.10)/1.30, 0, 1);
    if(ground > 0.01){
      ctx.globalCompositeOperation = 'lighter';
      ctx.save();
      ctx.translate(cx, groundY + H*0.012);
      ctx.scale(1, 0.20);
      var gr = baseR*2.95;
      var gg = ctx.createRadialGradient(0,0,0,0,0,gr);
      gg.addColorStop(0,   'rgba(255,244,222,'+ (0.34*ground) +')');
      gg.addColorStop(0.34,'rgba(255,224,186,'+ (0.18*ground) +')');
      gg.addColorStop(1,   'rgba(255,206,170,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0,0,gr,0,TAU); ctx.fill();
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 树脚的礼物盒：粒子一颗颗从地面堆出来 */
    var gq = clamp((t - T_GIFT)/T_GIFTD, 0, 1);
    if(gq > 0 && G.length){
      /* 先叠一层柔光，再以正常混合画实点，避免一遍 lighter 把盒子冲成白块 */
      ctx.globalCompositeOperation = 'lighter';
      for(var gi=0; gi<G.length; gi++){
        var g = G[gi];
        var gpp = clamp((gq - g.dly)/0.42, 0, 1);
        if(gpp <= 0) continue;
        var ge = easeOutCubic(gpp);
        var ga = ge*(0.88 + 0.12*Math.sin(t*2.2 + g.ph));
        ctx.fillStyle = 'rgba('+g.c+','+ (ga*0.22) +')';
        ctx.beginPath(); ctx.arc(g.x, g.y + (1-ge)*30, g.sz*3.2, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      for(var gi2=0; gi2<G.length; gi2++){
        var g2 = G[gi2];
        var gp2 = clamp((gq - g2.dly)/0.42, 0, 1);
        if(gp2 <= 0) continue;
        var ge2 = easeOutCubic(gp2);
        var ga2 = ge2*(0.90 + 0.10*Math.sin(t*2.2 + g2.ph));
        ctx.fillStyle = 'rgba('+g2.c+','+ (ga2*0.96) +')';
        ctx.beginPath(); ctx.arc(g2.x, g2.y + (1-ge2)*30, g2.sz, 0, TAU); ctx.fill();
      }
    }

    /* 树顶星：整棵树亮满时才点起来 */
    var crown = clamp((t - (T_GROW + T_GROWD - 0.22))/0.55, 0, 1);
    if(crown > 0.01){
      var cc = Math.pow(crown, 1.4);
      flare(cx, topY + treeH*0.012, starR*0.80*(0.6+0.4*cc), cc*0.92, -t*0.26);
    }

    /* 飘雪：盖在最前面，谁在前面飘谁就大 */
    ctx.globalCompositeOperation = 'lighter';
    drawSnow(t, 1);
    ctx.globalCompositeOperation = 'source-over';

    /* 文字浮现 */
    if(t >= T_TEXT && words && !words.classList.contains('show')){
      words.classList.add('show');
    }

    /* 树和字都亮稳之后，浮出"轻触画面"的提示；点一下才翻到唱片页 */
    if(t >= T_HINT) showHint();
  }

  function loop(ts){
    if(!running){ rafId = 0; return; }
    var t = FREEZE > 0 ? FREEZE : (ts - t0)/1000;
    if(!started){
      /* 封面：安静的黑 + 一点点雪，别让首屏是个死画面 */
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation = 'lighter';
      drawSnow(t*0.9, 0.55);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      draw(t);
      pulseDisc();                       /* 外圈光晕跟着音乐起落 */
    }
    rafId = requestAnimationFrame(loop);
    return rafId;
  }

  function begin(){
    if(started) return;
    started = true;
    go.classList.add('off');
    /* 就算系统开了"减少动态"，也照常把这场动画放完，只是节奏放快一点 */
    /* 就算系统开了"减少动态"，也照常把这场动画放完，只是节奏放快一点 */
    if(reduced){
      T_BURST = 0.55; T_GATHER = 1.05; T_GDUR = 1.5; T_GROW = 2.45; T_GROWD = 1.9;
      T_GIFT = 3.55; T_GIFTD = 0.95;
      T_TEXT = 4.45; T_HINT = 5.10; T_DISC = 5.60;
    }
    t0 = performance.now();
    running = true;
    unlockAudio();                        /* 借这次点击把音频解锁，稍后动画播完才能自动播放 */
    if(!rafId) rafId = requestAnimationFrame(loop);
  }

  go.addEventListener('click', begin);
  cv.addEventListener('click', begin);   /* 点画面任意处也能开始 */
  window.addEventListener('click', tryNext);   /* 提示出来后，再点一下就进唱片页 */
  window.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      if(started) tryNext(); else begin();
    }
  });

  var rzTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rzTimer);
    rzTimer = setTimeout(resize, 160);
  });

  resize();

  if(FREEZE > 0){
    go.style.display = 'none';
    started = true; running = true;
    t0 = performance.now();
    if(FREEZE >= T_TEXT && words){
      words.classList.add('show');
      words.style.transition = 'none';
      words.style.opacity = '1';
      words.style.transform = 'none';
    }
    draw(FREEZE);                       /* 先同步画一帧，窗口不在前台时也能看到这一帧 */
    if(FREEZE >= T_HINT) showHint();
    if(FREEZE >= T_DISC) showDisc(true); /* 定格在唱片页时直接显示，方便截图检查 */
    if(!rafId) rafId = requestAnimationFrame(loop);
  } else if(!reduced){
    /* 封面也跑一个轻量循环：只飘雪，首屏不至于完全静止 */
    running = true;
    t0 = performance.now();
    if(!rafId) rafId = requestAnimationFrame(loop);
  } else {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  }

  window.addEventListener('pagehide', function(){ running = false; });
})();
</script>
</body>
</html>
